name: Sentinel-2 NDVI weekly

# Live weekly pipeline: Sentinel-2 NDVI for all 16 districts, every Monday
# 03:00 UTC (08:00 PKT). Writes data/sentinel-ndvi.json (the live snapshot)
# and one real NDVI picture per district in data/ndvi-pics/.
# Manual runs are still possible via workflow_dispatch.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests numpy tifffile pillow

      - name: Fetch Sentinel-2 NDVI
        env:
          COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
        run: python scripts/fetch_sentinel.py

      - name: Commit weekly snapshot
        run: |
          git config user.name "kashifsajjadkhan"
          git config user.email "kashifsajjadkhan@users.noreply.github.com"
          git add data/sentinel-ndvi.json data/ndvi-pics/
          git diff --cached --quiet || git commit -m "Sentinel-2 NDVI weekly snapshot"
          git push
