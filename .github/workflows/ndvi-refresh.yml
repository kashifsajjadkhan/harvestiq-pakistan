name: Refresh satellite NDVI snapshot

# DISABLED 2026-11-08 (Sentinel-2 swap): the weekly schedule is off so this
# MODIS pipeline can no longer run automatically. It can still be triggered
# manually (Actions tab -> "Refresh satellite NDVI snapshot" -> Run workflow).
# The live site now reads Sentinel-2 data (data/sentinel-ndvi.json), so the
# MODIS snapshot (data/ndvi.json) is kept only as a historical record.

on:
  # schedule: (disabled — Sentinel-2 is the live source now)
  #   - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest MODIS NDVI
        run: python scripts/fetch_ndvi.py

      - name: Commit snapshot
        run: |
          git config user.name "kashifsajjadkhan"
          git config user.email "kashifsajjadkhan@users.noreply.github.com"
          git add data/ndvi.json
          git diff --cached --quiet || git commit -m "chore: weekly MODIS NDVI snapshot"
          git push
